name: Controles

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussee sur la meme branche annule le controle en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, tests et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verifier les icones importees
        run: npm run check

      # Les tests montent un PostgreSQL en memoire (PGlite) : aucun service a
      # demarrer ici. Le jeu de demonstration, lui, exige un stockage objet ;
      # tests/scripts.test.js verifie qu'il se charge, sans le derouler.
      - name: Tests
        run: npm test

      # Volontairement sans variable d'environnement : c'est ainsi que
      # construit un hebergeur avant qu'on ne les ait renseignees. Poser
      # NEXTAUTH_URL ici avait masque une panne jusqu'au premier deploiement.
      - name: Build de production
        run: npm run build
        env:
          VERCEL_URL: "" # Vercel la laisse vide pendant la construction
